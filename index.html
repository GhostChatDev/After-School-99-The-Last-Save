<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>After School ’99: The Last Save</title>
<meta name="theme-color" content="#11172c">
<meta name="description" content="A nostalgic Snake-style adventure about the memories we carry forward.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#11172c;--panel:#1b2442;--border:#3a4a86;--text:#f2f0e6;--muted:#b4bad4;--accent:#ffd84a;--pip:#4dffb5;--danger:#ff6b81;--r:10px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 20%,#1e2954,#0f1428 65%,#080b18);color:var(--text);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}body{display:flex;flex-direction:column;align-items:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);min-width:44px;min-height:44px;padding:9px 14px;cursor:pointer;transition:background .15s,transform .15s}button:hover{background:#29355c}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:default}h1,h2,p{margin-top:0}h1{font-size:clamp(28px,6vw,46px);line-height:1.12;margin-bottom:8px}h1 span{display:block;color:var(--accent)}h2{font-size:24px;margin-bottom:8px}#app{width:min(100%,720px)}.screen{padding:16px 0}.eyebrow{color:var(--pip);font-size:12px;letter-spacing:2px}.muted,.story p{color:var(--muted)}.story{max-width:540px;margin:22px auto;text-align:left}.story p{margin-bottom:10px}.actions{display:grid;gap:10px;width:min(100%,360px);margin:auto}.actions button{position:relative}.actions button.highlight{border-color:var(--accent);background:#303650;color:var(--accent)}.actions button.highlight:before{content:'▶';position:absolute;left:14px}.actions button kbd{float:right;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.toolbar .title{font-weight:bold;color:var(--accent)}.toolbar div{display:flex;gap:8px}.icon{padding:6px 12px;font-size:20px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:12px 0;text-align:left}.chapter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chapter-grid button{text-align:left;padding:12px}.chapter-grid small{display:block;color:var(--muted);font-size:13px}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:8px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}.hud strong{display:block;font-size:18px}.hud .sparks{color:var(--pip)}#canvas{display:block;width:100%;height:auto;max-height:min(66vh,600px);margin:10px auto;background:#0c1123;border:2px solid var(--border);border-radius:var(--r);image-rendering:pixelated;touch-action:none}.hint{text-align:center;color:var(--muted);font-size:14px}.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,48px);justify-content:center;gap:8px;margin:10px auto}.dpad [data-dir=up]{grid-column:2}.dpad [data-dir=left]{grid-column:1}.dpad [data-dir=down]{grid-column:2}.dpad [data-dir=right]{grid-column:3}.modal{position:fixed;inset:0;background:#080b18e8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;overflow:auto}.modal[hidden]{display:none}.modal-card{background:var(--panel);border:2px solid var(--border);border-radius:var(--r);padding:22px;width:min(100%,420px);text-align:center}.modal .actions{width:100%}label{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px}input[type=checkbox]{width:24px;height:24px}.primary{background:var(--accent);color:#11172c;border-color:var(--accent);font-weight:bold}.danger{color:var(--danger)}.center{text-align:center}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.results div{background:#111a33;padding:12px 4px;border-radius:var(--r);font-variant-numeric:tabular-nums}.results strong{display:block;font-size:22px;color:var(--accent)}
@media(min-width:700px){.chapter-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main id="app"><section id="screen" class="screen" aria-live="polite"></section></main>
<div id="overlay" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="overlay-title"><div id="overlay-card" class="modal-card"></div></div>
<noscript>This game needs JavaScript enabled.</noscript>
<script>
'use strict';
const {LEVELS,createGame,step,turn,legalTurns}=window.GameLogic;
const $=id=>document.getElementById(id);
const KEY='after-school-99-save-v1';
const defaults={unlocked:0,completed:{},best:0,bestStars:0,sound:true,motion:true,seenIntro:false};
let save={...defaults};try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save={...defaults,...s,completed:s.completed||{}}}catch{}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch{}};
let state='title',game=null,selected=0,menuSelection=0,menuReturn=null,menuPaused=false,helpReturn='title';
let lastTime=0,elapsed=0,raf=0,transitionTimer=0,deadline=0,queuedDir=null,swipeStart=null,audio=null;
const menuItems=()=>[{id:'start',text:save.unlocked?'Continue adventure':'Start adventure'},{id:'chapters',text:'Chapter select'},{id:'help',text:'How to Play'}];
function button(id,text,cls=''){return `<button class="${cls}" data-action="${id}">${text}</button>`}
function renderTitle(){state='title';game=null;stopLoop();selected=Math.max(0,Math.min(selected,menuItems().length-1));$('screen').innerHTML=`<div class="toolbar"><span class="eyebrow">MEMORY ARCADE · 1999</span><div>${button('help','?','icon')} ${button('menu','☰','icon')}</div></div><div class="center"><h1>After School ’99<span>The Last Save</span></h1><p class="muted">One last game. One more memory.</p><div class="story"><p>The computer hums in the corner. The final bell has already rung, and Pip is still trapped inside your favourite game.</p><p>Gather the lost memory sparks, guide Pip to each exit, and bring the old save home.</p></div></div><div class="actions" id="title-actions">${menuItems().map((m,i)=>button(m.id,`${m.text}${i===0?' <kbd>A</kbd>':''}`,i===selected?'highlight':'')).join('')}</div><p class="hint">↑ ↓ choose · A or Enter select · ? help</p>`}
function moveHighlight(delta){const items=menuItems();selected=(selected+delta+items.length)%items.length;document.querySelectorAll('#title-actions button').forEach((b,i)=>{b.classList.toggle('highlight',i===selected);b.setAttribute('aria-current',i===selected?'true':'false')})}
function toolbar(title){return `<div class="toolbar">${button('title','← Title')}<span class="title">${title}</span><div>${button('help','?','icon')} ${button('menu','☰','icon')}</div></div>`}
function renderChapters(){state='chapters';game=null;stopLoop();$('screen').innerHTML=toolbar('Chapter select')+'<div class="chapter-grid">'+LEVELS.map((l,i)=>{const locked=i>save.unlocked,stars=save.completed[i]||0;return `<button data-level="${i}" ${locked?'disabled':''} aria-label="Chapter ${i+1}: ${l.name}${locked?', locked':''}"><strong>${String(i+1).padStart(2,'0')} · ${locked?'Locked':l.name}</strong><small>${locked?'Finish the previous chapter':l.theme+(stars?' · '+'★'.repeat(stars)+'☆'.repeat(3-stars):'')}</small></button>`}).join('')+'</div>'}
function renderHelp(){helpReturn=state==='help'?'title':state;state='help';stopLoop();$('screen').innerHTML=toolbar('How to Play')+`<div class="panel"><h2 id="help-title">Bring every memory home</h2><p>Move Pip with the <strong>arrow keys</strong>, <strong>WASD</strong>, swipe, or the on-screen arrows. Turns happen on the press; one turn is queued for the next grid step.</p><p>Collect every <strong style="color:var(--pip)">memory spark</strong>, then enter the glowing exit. Avoid walls, your own trail, dust bunnies and locked doors.</p><p><strong>A</strong> or <strong>Enter</strong> selects the highlighted title item. <strong>?</strong> opens this guide. <strong>☰</strong> opens the menu. <strong>Space</strong> pauses a run; <strong>Escape</strong> opens the menu or goes back.</p><p>Finish with sparks and health left for three stars. Chapters and best scores are saved on this device.</p></div>${button('back','Back','primary')}`}
function renderGame(){state='play';$('screen').innerHTML=`<div class="toolbar">${button('pause','Ⅱ Pause')}<span class="title">${game.levelIndex+1}. ${game.level.name}</span>${button('menu','☰','icon')}</div><div class="hud"><div>Sparks<strong class="sparks" id="sparks">${game.collected}/${game.totalSparks}</strong></div><div>Score<strong id="score">${game.score}</strong></div><div>Health<strong id="health">${game.health}/${game.level.health}</strong></div></div><canvas id="canvas" width="${game.cols*20}" height="${game.rows*20}" aria-label="Snake game board"></canvas><p class="hint" id="game-hint">${game.level.message}</p><div class="dpad" aria-label="Movement controls"><button data-dir="up" aria-label="Move up">↑</button><button data-dir="left" aria-label="Move left">←</button><button data-dir="down" aria-label="Move down">↓</button><button data-dir="right" aria-label="Move right">→</button></div>`;draw();updateHud();startLoop()}
</script>
<script>
'use strict';
function startGame(index=save.unlocked){closeOverlay();clearTimeout(transitionTimer);game=createGame(index);selected=0;queuedDir=null;elapsed=0;lastTime=performance.now();renderGame();beep(330,.06)}
function startLoop(){stopLoop();lastTime=performance.now();raf=requestAnimationFrame(loop)}
function stopLoop(){cancelAnimationFrame(raf);raf=0}
function loop(now){if(state!=='play')return;const delta=Math.min(100,now-lastTime);lastTime=now;elapsed+=delta;while(elapsed>=game.stepMs&&state==='play'){elapsed-=game.stepMs;if(queuedDir){turn(game,queuedDir);queuedDir=null}step(game);updateHud();if(game.status==='lost'){loseGame();break}if(game.status==='won'){winGame();break}}if(state==='play'){draw();raf=requestAnimationFrame(loop)}}
function updateHud(){if(!game)return;$('sparks').textContent=`${game.collected}/${game.totalSparks}`;$('score').textContent=game.score;$('health').textContent=`${game.health}/${game.level.health}`;$('game-hint').textContent=game.collected===game.totalSparks?'The exit is open — bring the memory home!':game.level.message}
function draw(){const c=$('canvas');if(!c||!game)return;const x=c.getContext('2d'),s=c.width/game.cols;x.clearRect(0,0,c.width,c.height);x.fillStyle='#0c1123';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#182343';x.lineWidth=1;for(let i=1;i<game.cols;i++){x.beginPath();x.moveTo(i*s,0);x.lineTo(i*s,c.height);x.stroke()}for(let i=1;i<game.rows;i++){x.beginPath();x.moveTo(0,i*s);x.lineTo(c.width,i*s);x.stroke()}const rect=(p,color,pad=3)=>{x.fillStyle=color;x.fillRect(p.x*s+pad,p.y*s+pad,s-pad*2,s-pad*2)};game.level.layout.forEach((row,y)=>[...row].forEach((v,xx)=>{if(v==='W')rect({x:xx,y},'#4b5880',2);if(v==='D')rect({x:xx,y},'#b47554',2);if(v==='S')rect({x:xx,y},game.level.sparks.some(p=>p.x===xx&&p.y===y)?'#ffd84a':'#0c1123',5)}));game.level.enemies.forEach(p=>{if(!game.snake.some(q=>q.x===p.x&&q.y===p.y))rect(p,'#ff6b81',5)});game.sparks.forEach(p=>{x.fillStyle='#4dffb5';x.beginPath();x.arc((p.x+.5)*s,(p.y+.5)*s,s*.22,0,Math.PI*2);x.fill()});const open=game.collected===game.totalSparks;rect(game.level.exit,open?'#ffd84a':'#354369',3);game.snake.slice().reverse().forEach((p,i)=>rect(p,i===game.snake.length-1?'#b9ffe0':'#35d996',i===game.snake.length-1?2:3));const head=game.snake[0];x.fillStyle='#11172c';x.fillRect(head.x*s+6,head.y*s+6,3,3)}
function move(dir){if(state!=='play')return;turn(game,dir);queuedDir=dir;beep(190,.025)}
function pause(){if(state!=='play')return;state='paused';stopLoop();showOverlay('Paused','Pip is waiting. Take your time.',[['resume','Resume','primary'],['restart','Restart chapter'],['help','How to Play'],['title','Title screen']])}
function loseGame(){stopLoop();state='lost';beep(90,.25);save.best=Math.max(save.best,game.score);persist();showOverlay('Run ended','Pip hit a wall, dust bunny, locked door, or its own trail. Try a different route.',[['restart','Try again','primary'],['chapters','Chapter select'],['title','Title screen']])}
function winGame(){stopLoop();state='won';const stars=1+(game.health===game.level.health?1:0)+(game.score>=game.totalSparks*100?1:0);save.completed[game.levelIndex]=Math.max(save.completed[game.levelIndex]||0,stars);save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length-1,game.levelIndex+1));save.best=Math.max(save.best,game.score);save.bestStars=Object.values(save.completed).reduce((a,b)=>a+b,0);persist();beep(660,.15);if(game.levelIndex===LEVELS.length-1){showOverlay('The last save is home','You guided Pip through every memory. The screen goes quiet, but the adventure stays with you.',[['chapters','Replay chapters','primary'],['title','Title screen']])}else{showOverlay(`Chapter ${game.levelIndex+1} complete`,`${'★'.repeat(stars)}${'☆'.repeat(3-stars)}<br>Score: ${game.score}<br>The next memory is unlocked.`,[['next','Next chapter','primary'],['restart','Replay'],['chapters','Chapter select']])}}
function showOverlay(title,html,buttons){$('overlay-card').innerHTML=`<h2 id="overlay-title">${title}</h2><p>${html}</p><div class="actions">${buttons.map(([id,t,c])=>button(id,t,c||'')).join('')}</div>`;$('overlay').hidden=false;$('overlay-card').querySelector('button')?.focus()}
function closeOverlay(){$('overlay').hidden=true}
function openMenu(){if(state==='menu'){closeMenu();return}if(state==='help'&&$('overlay').hidden){showOverlay('Menu','Where would you like to go?',menuButtons());menuReturn='help';return}menuReturn=state;menuPaused=state==='play';if(menuPaused){stopLoop();state='paused'}menuSelection=0;showOverlay('Menu','Where would you like to go?',menuButtons())}
function menuButtons(){return[['resume-or-close',menuPaused?'Resume':'Close menu','primary'],['chapters','Chapter select'],['help','How to Play'],['sound',`Sound: ${save.sound?'on':'off'}`],['motion',`Reduced motion: ${save.motion?'off':'on'}`],['title','Title screen']]}
function closeMenu(){closeOverlay();if(menuPaused&&game){state='play';startLoop()}menuPaused=false;menuReturn=null}
function renderSound(){return `Sound: ${save.sound?'on':'off'}`}
function beep(freq,duration){if(!save.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function goBack(){closeOverlay();if(state==='help'&&helpReturn==='play'&&game){state='play';renderGame()}else if(state==='help'&&helpReturn==='paused'){state='play';pause()}else if(helpReturn==='chapters')renderChapters();else renderTitle()}
function act(id){if(!id)return;if(id==='start'){startGame(Math.min(save.unlocked,LEVELS.length-1));return}if(id==='chapters'){closeOverlay();renderChapters();return}if(id==='help'){if(state==='play'){stopLoop();helpReturn='play'}else if(state==='paused')helpReturn='paused';else helpReturn=state==='help'?'title':state;closeOverlay();renderHelp();return}if(id==='back'){goBack();return}if(id==='menu'){openMenu();return}if(id==='resume-or-close'){closeMenu();return}if(id==='resume'){closeOverlay();state='play';startLoop();return}if(id==='pause'){pause();return}if(id==='restart'){startGame(game?game.levelIndex:0);return}if(id==='next'){startGame(Math.min(LEVELS.length-1,game.levelIndex+1));return}if(id==='title'){closeOverlay();renderTitle();return}if(id==='sound'){save.sound=!save.sound;persist();document.querySelector('[data-action=sound]').textContent=renderSound();return}if(id==='motion'){save.motion=!save.motion;persist();document.querySelector('[data-action=motion]').textContent=`Reduced motion: ${save.motion?'off':'on'}`;return}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.dir){move(b.dataset.dir);return}if(b.dataset.level!==undefined){startGame(Number(b.dataset.level));return}if(b.closest('#title-actions'))selected=menuItems().findIndex(m=>m.id===b.dataset.action);act(b.dataset.action)});
document.addEventListener('keydown',e=>{if(e.repeat)return;const key=e.key.toLowerCase();if(key==='?'||(key==='/'&&e.shiftKey)){e.preventDefault();act('help');return}if(key==='m'||key==='☰'){e.preventDefault();openMenu();return}if(key==='escape'){e.preventDefault();if(!$('overlay').hidden){if(state==='paused'&&menuReturn)closeMenu();else if(state==='paused')act('resume');else closeOverlay()}else if(state==='play')openMenu();else if(state==='chapters')renderTitle();else if(state==='help')goBack();else openMenu();return}if(!$('overlay').hidden)return;if(state==='title'){if(['arrowup','arrowleft','w'].includes(key)){e.preventDefault();moveHighlight(-1);return}if(['arrowdown','arrowright','s','tab'].includes(key)){e.preventDefault();moveHighlight(1);return}if(key==='a'||key==='enter'||key===' '){e.preventDefault();act(menuItems()[selected].id);return}}if(state==='chapters'&&key==='a'){document.querySelector('[data-level]:not(:disabled)')?.click();return}if(state==='play'){const dirs={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(dirs[key]){e.preventDefault();move(dirs[key])}else if(key===' '||key==='p'){e.preventDefault();pause()}}});
const canvasPointer=e=>{if(e.target.id==='canvas')swipeStart={x:e.clientX,y:e.clientY}};document.addEventListener('pointerdown',canvasPointer);document.addEventListener('pointerup',e=>{if(!swipeStart)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});renderTitle();
</script></body></html>
