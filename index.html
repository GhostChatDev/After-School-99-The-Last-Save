<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151328"><meta name="apple-mobile-web-app-capable" content="yes">
<title>After School '99: The Last Save</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="room" aria-hidden="true"><div class="wall-stars">✦　　·　　　✧　　　　　·　　✦</div><div class="poster"><b>COMPUTER<br>CLUB</b><span>FRIDAYS · 4:00 PM</span><i>BE THERE<br>OR BE ☐</i></div><div class="window"><i></i><i></i><i></i><b>☾</b></div><div class="shelf"><span>▥</span><span>▥</span><span>▥</span><span>▥</span><span>▥</span><span>▥</span></div></div>
<main class="desk">
  <header class="masthead"><span class="status-dot"></span><span>AS '99</span><span class="header-rule"></span><span id="dateLabel">NOV 23, 1999</span><button id="soundButton" class="icon-button" aria-label="Toggle sound" title="Toggle sound">♪</button><button id="menuButton" class="icon-button" aria-label="Open game menu" title="Menu">☰</button></header>
  <section class="computer" aria-label="Family computer">
    <div class="computer-top"><span class="brand">FAMILY COMPUTER</span><span class="model">FC-99 <i>turbo</i></span></div>
    <div class="bezel">
      <div class="screen-wrap">
        <canvas id="screen" width="960" height="576" tabindex="0" role="img" aria-label="After School '99 game screen. Use arrow keys or WASD to move."></canvas>
        <div class="crt-glass" aria-hidden="true"></div>
        <div id="ui" class="ui" hidden></div>
      </div>
    </div>
    <div class="computer-bottom"><span class="vent">||||||||||||||||</span><span class="power-light"></span><span class="power-label">POWER</span><button id="helpButton" class="hardware-button" aria-label="How to play">?</button></div>
  </section>
  <section class="controller" aria-label="Touch controls">
    <div class="dpad"><button data-move="up" class="up" aria-label="Move up">▲</button><button data-move="left" class="left" aria-label="Move left">◀</button><span class="dpad-center">✦</span><button data-move="right" class="right" aria-label="Move right">▶</button><button data-move="down" class="down" aria-label="Move down">▼</button></div>
    <div class="controller-note"><b>ONE STEP AT A TIME</b><span>ARROWS / WASD</span></div>
    <button id="actionButton" class="action-button" aria-label="Interact or select"><span>A</span><small>SELECT</small></button>
    <button id="pauseButton" class="pause-button" aria-label="Pause game">Ⅱ <span>PAUSE</span></button>
  </section>
  <footer><span>INSERT MEMORY · PRESS START</span><span>MADE AFTER SCHOOL ♡</span></footer>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/logic.js"></script><script src="js/missions.js"></script><script src="js/audio.js"></script><script src="js/shop.js"></script><script src="js/game.js"></script>
</body></html>
